name: test
on: push
jobs:
  windows-x86:
    name: windows (x86)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actboy168/setup-luamake@master
    - run: luamake -arch x86 -notest -sanitize
    - run: luamake test -v
  windows-x86_64:
    name: windows (x86_64)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actboy168/setup-luamake@master
    - run: luamake -arch x86_64 -notest -sanitize
    - run: luamake test -v
  windows-arm64:
    name: windows (arm64)
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4
    - name: Verify native ARM64 runner
      shell: pwsh
      run: |
        if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
          throw "Expected an ARM64 runner, got $env:PROCESSOR_ARCHITECTURE"
        }
    - uses: actboy168/setup-luamake@master
    - run: luamake -arch arm64 -notest
    - run: luamake test -v
    - name: Verify ARM64 artifacts
      shell: pwsh
      run: |
        $expectedMachine = 0xAA64
        $peFiles = Get-ChildItem build/bin -File |
          Where-Object { $_.Extension -in ".exe", ".dll" }
        if (-not $peFiles) {
          throw "No PE artifacts found in build/bin"
        }
        foreach ($file in $peFiles) {
          $bytes = [IO.File]::ReadAllBytes($file.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne $expectedMachine) {
            throw "$($file.FullName) has PE machine 0x$($machine.ToString('X4')); expected 0xAA64"
          }
          Write-Host "$($file.FullName): PE machine 0xAA64"
        }
        $asmObjects = @(Get-ChildItem build -Recurse -Filter fast_setjmp_arm64.obj)
        if ($asmObjects.Count -lt 1) {
          throw "No fast_setjmp_arm64.obj artifacts found"
        }
        foreach ($asmObject in $asmObjects) {
          $objectBytes = [IO.File]::ReadAllBytes($asmObject.FullName)
          $objectMachine = [BitConverter]::ToUInt16($objectBytes, 0)
          if ($objectMachine -ne $expectedMachine) {
            throw "$($asmObject.FullName) has COFF machine 0x$($objectMachine.ToString('X4')); expected 0xAA64"
          }
          Write-Host "$($asmObject.FullName): COFF machine 0xAA64"
        }
  windows-clang:
    name: windows (clang)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actboy168/setup-luamake@master
    - run: luamake -cc clang-cl -notest
    - run: luamake test -v
  windows-mingw:
    name: windows (mingw)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        path: luamake
        repository: actboy168/luamake
        submodules : recursive
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-ninja
    - shell: msys2 {0}
      working-directory: luamake
      run: ./compile/build.sh notest
    - shell: msys2 {0}
      run: |
        ./luamake/luamake -notest
        ./luamake/luamake test -v
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [14, 15, 26, 15-intel]
    runs-on: macos-${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actboy168/setup-luamake@master
    - run: luamake -notest -sanitize
    - run: luamake test -v
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [22.04, 24.04-arm]
    runs-on: ubuntu-${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actboy168/setup-luamake@master
    - run: luamake -notest -sanitize
    - run: luamake lua test/glibc-version.lua
    - run: luamake test -v
  linux-qemu:
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7, riscv64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          path: luamake
          repository: actboy168/luamake
          submodules : recursive
      - uses: uraimo/run-on-arch-action@v3
        continue-on-error: true
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu22.04
          dockerRunArgs: |
            --volume "${PWD}:/actboy168"
          install: |
            apt-get update -q -y
            apt-get install -q -y gcc g++ ninja-build
            apt-get install -q -y binutils-dev libunwind-dev
          run: |
            pushd luamake
            ./compile/build.sh notest
            popd
            ./luamake/luamake -notest
            ./luamake/luamake lua test/glibc-version.lua
            ./luamake/luamake test -v
  bsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: '14.2'
            install: pkg install -y ninja libinotify
          - os: openbsd
            version: '7.6'
            install: pkg_add ninja libinotify
          - os: netbsd
            version: '10.1'
            install: pkgin -y install ninja-build libinotify
    name: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          path: luamake
          repository: actboy168/luamake
          submodules : recursive
      - uses: cross-platform-actions/action@v1.0.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          run: |
            sudo ${{ matrix.install }}
            cd luamake
            ./compile/build.sh notest
            cd ..
            ./luamake/luamake -noetst
            ./luamake/luamake test -v
